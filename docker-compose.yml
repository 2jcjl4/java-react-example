services:
  database:
    image: postgres:16-alpine
    container_name: grocery-database
    environment:
      POSTGRES_DB: ${DB_NAME:-grocery}
      POSTGRES_USER: ${DB_USER:-grocery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grocery_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - grocery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grocery} -d ${DB_NAME:-grocery}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: grocery-backend
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-grocery}
      DB_USER: ${DB_USER:-grocery}
      DB_PASSWORD: ${DB_PASSWORD:-grocery_local_dev}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
    ports:
      - "9080:9080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: grocery-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  grocery-data:
